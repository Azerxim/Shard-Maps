server {
    listen {{PORT}};
    server_name _;
    root {{ROOT_PATH}};

    # Index files
    index index.html;

    # Assets - static files (CSS, JS, images, fonts, ...)
    # Servis tels quels, jamais interprétés comme une "carte" par les
    # règles de rewrite ci-dessous.
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, immutable";

        # Scripts et styles non versionnés : toujours revalider, sinon les
        # navigateurs gardent l'ancienne version pendant 7 jours après une mise à jour.
        location ~* \.(js|css)$ {
            try_files $uri =404;
            access_log off;
            # expires -1 annule le "expires 7d" hérité (sinon Expires et max-age
            # restent envoyés à côté du no-cache, et une version déjà en cache
            # peut être servie pendant 7 jours sans revalidation).
            expires -1;
            add_header Cache-Control "no-cache";
        }
    }
    # /assets sans le slash final ne doit pas être pris pour une "carte"
    # par la règle générique ci-dessous.
    rewrite ^/assets$ /assets/ permanent;

    # About page
    rewrite ^/about$ /about.html last;

    # API routes
    rewrite ^/api/get/([a-z]+?)$ /api/get/$1.js last;
    rewrite ^/api/put/([a-z]+?)$ /api/put/$1.js last;
    rewrite ^/api/$ /error.html last;
    rewrite ^/api/get/$ /error.html last;
    rewrite ^/api/put/$ /error.html last;

    # Carte - single parameter
    rewrite ^/([a-z]+?)$ /index.html?data=$1 last;
    rewrite ^/([a-z]+?)_([a-z]+?)$ /index.html?data=$1_$2 last;
    rewrite ^/([a-z]+?)_([a-z]+?)_([a-z]+?)$ /index.html?data=$1_$2_$3 last;

    # Embed files
    rewrite ^/([a-z]+?)-embed$ /embed.html?data=$1 last;
    rewrite ^/([a-z]+?)_([a-z]+?)-embed$ /embed.html?data=$1_$2 last;
    rewrite ^/([a-z]+?)_([a-z]+?)_([a-z]+?)-embed$ /embed.html?data=$1_$2_$3 last;

    # embedfull files
    rewrite ^/([a-z]+?)-embedfull$ /embedfull.html?data=$1 last;
    rewrite ^/([a-z]+?)_([a-z]+?)-embedfull$ /embedfull.html?data=$1_$2 last;
    rewrite ^/([a-z]+?)_([a-z]+?)_([a-z]+?)-embedfull$ /embedfull.html?data=$1_$2_$3 last;

    # Locate files
    rewrite ^/([a-z]+?)-locate$ /locate.html?data=$1 last;
    rewrite ^/([a-z]+?)_([a-z]+?)-locate$ /locate.html?data=$1_$2 last;
    rewrite ^/([a-z]+?)_([a-z]+?)_([a-z]+?)-locate$ /locate.html?data=$1_$2_$3 last;

    # Editor files
    rewrite ^/([a-z]+?)-editor$ /editor.html?data=$1 last;
    rewrite ^/([a-z]+?)_([a-z]+?)-editor$ /editor.html?data=$1_$2 last;
    rewrite ^/([a-z]+?)_([a-z]+?)_([a-z]+?)-editor$ /editor.html?data=$1_$2_$3 last;

    # Options - with theme parameter
    rewrite ^/([a-z]+?)-([a-z]+?)$ /index.html?data=$1 last;
    rewrite ^/([a-z]+?)_([a-z]+?)-([a-z]+?)$ /index.html?data=$1_$2 last;
    rewrite ^/([a-z]+?)_([a-z]+?)_([a-z]+?)-([a-z]+?)$ /index.html?data=$1_$2_$3 last;

    rewrite ^/([a-z]+?)-embed-([a-z]+?)$ /embed.html?data=$1 last;
    rewrite ^/([a-z]+?)_([a-z]+?)-embed-([a-z]+?)$ /embed.html?data=$1_$2 last;
    rewrite ^/([a-z]+?)_([a-z]+?)_([a-z]+?)-embed-([a-z]+?)$ /embed.html?data=$1_$2_$3 last;

    rewrite ^/([a-z]+?)-embedfull-([a-z]+?)$ /embedfull.html?data=$1 last;
    rewrite ^/([a-z]+?)_([a-z]+?)-embedfull-([a-z]+?)$ /embedfull.html?data=$1_$2 last;
    rewrite ^/([a-z]+?)_([a-z]+?)_([a-z]+?)-embedfull-([a-z]+?)$ /embedfull.html?data=$1_$2_$3 last;

    rewrite ^/([a-z]+?)-locate-([a-z]+?)$ /locate.html?data=$1 last;
    rewrite ^/([a-z]+?)_([a-z]+?)-locate-([a-z]+?)$ /locate.html?data=$1_$2 last;
    rewrite ^/([a-z]+?)_([a-z]+?)_([a-z]+?)-locate-([a-z]+?)$ /locate.html?data=$1_$2_$3 last;

    rewrite ^/([a-z]+?)-editor-([a-z]+?)$ /editor.html?data=$1 last;
    rewrite ^/([a-z]+?)_([a-z]+?)-editor-([a-z]+?)$ /editor.html?data=$1_$2 last;
    rewrite ^/([a-z]+?)_([a-z]+?)_([a-z]+?)-editor-([a-z]+?)$ /editor.html?data=$1_$2_$3 last;
}
